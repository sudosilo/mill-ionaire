name: mill-ionaire itch build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Play the game end to end
        run: node mill-ionaire-v2-test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the newest game file as index.html for itch
        run: |
          GAME=$(ls mill-ionaire-v*.html | sort -V | tail -n 1)
          VER=$(basename "$GAME" .html)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p itch-build
          cp "$GAME" itch-build/index.html
          (cd itch-build && zip -q "../$VER-itch.zip" index.html)
          ls -l "$VER-itch.zip"

      - name: Publish the zip as the itch-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete itch-latest --yes --cleanup-tag || true
          gh release create itch-latest "$VER-itch.zip" --title "$VER itch build" --notes "Upload this zip to itch.io as an HTML game."
